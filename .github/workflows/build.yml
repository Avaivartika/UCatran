name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-15
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: python scripts/setup_connector.py
      - run: npm test
      - name: Test Moodle pagination and library indexing
        run: python -c "import sys, unittest; sys.path[:0] = ['vendor/moodle-mcp', 'runtime/site']; result = unittest.TextTestRunner().run(unittest.defaultTestLoader.discover('tests', pattern='test_*.py')); sys.exit(not result.wasSuccessful())"
      - run: npm run package:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: UCatran-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
